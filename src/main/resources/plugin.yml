name: GawharaeClog
version: '${project.version}'
main: dev.gawhara.clog.GawharaeClog
api-version: '26.3'
authors: [Gawharasmp]
description: سجل مفصّل بالعربي لكل تحويل للكريتف والأغراض اللي اتسحبت، بيتبعت على ديسكورد.

commands:
  gclog:
    description: أوامر GawharaeClog
    usage: /gclog <reload|enable|disable|status|list|test|help>
    aliases: [gawharaeclog, clog]

permissions:
  gawharaeclog.admin:
    description: استخدام أوامر /gclog
    default: op
  gawharaeclog.notify:
    description: تنبيه جوه اللعبة لما حد يدخل الكريتف
    default: op
  gawharaeclog.bypass:
    description: اللي معاه الصلاحية دي مش بيتسجّل
    default: false
