# ============================================================
#  GawharaeClog - Gawharasmp
#  سجل مفصّل لكل حاجة بتحصل في الكريتف.
#  بعد أي تعديل: /gclog reload
# ============================================================

# مفتاح التشغيل الرئيسي (/gclog enable | disable)
enabled: true

# طريقة الإرسال لديسكورد:
#   webhook -> بيستخدم webhook-url (الويب هوك هو اللي بيحدد الروم)
#   bot     -> بيستخدم bot-token + channel-id (البوت لازم يكون في السيرفر وعنده
#              View Channel + Send Messages + Embed Links في الروم)
mode: webhook

# ----- لو mode: webhook -----
webhook-url: "PUT_WEBHOOK_URL_HERE"

# ----- لو mode: bot -----
bot-token: "PUT_BOT_TOKEN_HERE"
channel-id: "PUT_CHANNEL_ID_HERE"

# شكل المرسل (ويب هوك بس)
username: "Gawhara Clog"
avatar-url: ""

# بيظهر في أسفل كل رسالة
server-name: "Gawharasmp"

# منشن اختياري لما حد يدخل الكريتف:
#   "<@&ROLE_ID>" (رول)   "<@USER_ID>" (يوزر)   "@here"   "" (من غير)
mention: ""

# كل كام ثانية يتجمّع الأغراض ويتبعتوا في رسالة واحدة (عشان ديسكورد ميعملش rate limit)
batch-seconds: 5

# ----- إيه اللي يتسجّل -----
log:
  enter-creative: true            # لاعب دخل الكريتف
  leave-creative: true            # لاعب خرج من الكريتف (فيه ملخص الجلسة كاملة)
  join-in-creative: true          # لاعب دخل السيرفر وهو أصلاً كريتف
  quit-in-creative: true          # لاعب خرج من السيرفر وهو في الكريتف (فيه ملخص الجلسة)
  items-taken: true               # الأغراض اللي اتسحبت من قايمة الكريتف (بالاسم والعدد والتطعيمات)
  items-dropped-from-menu: true   # أغراض اترمت على الأرض من القايمة نفسها
  items-dropped: true             # أغراض رماها اللاعب (Q) وهو كريتف
  items-picked-up: false          # أغراض لقطها من الأرض وهو كريتف
  watched-commands: true          # الأوامر المراقَبة (give, summon, ...) من أي حد
  dangerous-block-place: true     # لاعب كريتف حط بلوك خطير (TNT, كوماند بلوك, ...)
  blocks-in-summary: true         # عدد البلوكات اللي حطها/كسرها في ملخص الجلسة

# بيسجّل الأسباب دي بس. القايمة الفاضية = كل الأسباب.
# القيم: COMMAND, PLUGIN, DEFAULT_GAMEMODE, HARDCORE_DEATH, UNKNOWN
causes: []

# لاعبين مش بيتسجّلوا أبداً (أسماء أو UUID). اللي معاه gawharaeclog.bypass كمان بيتخطّى.
ignored-players: []

# ----- محتوى الرسايل -----
embed:
  include-location: true
  include-uuid: true
  include-executor: true     # بيحاول يعرض مين نفّذ الأمر (لاعب/كونسول/كوماند بلوك)
  extended-info: true        # صحة/جوع/لفل/بنج/كلاينت/اللي في اليد/عدد اللاعبين/الاتجاه/البيئة
  include-ip: false          # عنوان IP (بيظهر كـ spoiler). اقفله لو مش محتاجه

titles:
  enter: "🟥 لاعب دخل وضع الكريتف"
  leave: "🟩 لاعب خرج من وضع الكريتف"
  join: "🟧 لاعب دخل السيرفر وهو في الكريتف"
  quit: "🚪 لاعب خرج من السيرفر وهو في الكريتف"
  items-taken: "📦 أغراض اتسحبت من قايمة الكريتف"
  items-menu-dropped: "🗑️ أغراض اترمت من قايمة الكريتف"
  items-dropped: "📤 أغراض اترمت على الأرض (كريتف)"
  items-picked-up: "📥 أغراض اتلقطت من الأرض (كريتف)"
  watched-command: "⌨️ أمر مراقَب اتنفّذ"

colors:
  enter: "#FF5555"
  leave: "#55FF55"
  join: "#FFAA00"
  items: "#5865F2"
  danger: "#FF0000"

# ----- الأغراض الخطيرة / الغالية -----
# أي غرض أو بلوك من دول بيتعلّم بـ ⚠️ والرسالة بتبقى حمرا ويتعمل منشن.
# بيتعلّم كمان أي تطعيم فوق الحد الطبيعي (زي Sharpness 255).
dangerous:
  mention: ""
  items:
    - BEDROCK
    - BARRIER
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - TNT
    - TNT_MINECART
    - SPAWNER
    - TRIAL_SPAWNER
    - DEBUG_STICK
    - LIGHT
    - END_PORTAL_FRAME
    - DRAGON_EGG
    - KNOWLEDGE_BOOK
    - ENCHANTED_GOLDEN_APPLE
    - TOTEM_OF_UNDYING
    - ELYTRA
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - BEACON
    - NETHER_STAR

# أوامر الجيم مود (بتتستخدم عشان نعرف مين نفّذ التحويل)
gamemode-commands: [gamemode, gm, gmc, gms, gma, gmsp, egamemode, egm, egmc, egms, egma, egmsp, creative, survival, adventure, spectator]

# أوامر مراقَبة: كل ما حد ينفّذها بتتسجّل (لاعب أو كونسول أو كوماند بلوك)
watched-commands: [give, i, item, summon, setblock, fill, clone, enchant, effect, gamerule, op, deop, tp, teleport]

# ----- تنبيه جوه اللعبة للي معاه gawharaeclog.notify -----
ingame-notify:
  enabled: true
  # المتغيرات: {player} {old} {new} {cause} {executor}
  message: "&c[Clog] &f{player} &7حوّل &7{old} &7← &c{new} &7(السبب: {cause}، بواسطة: {executor})"

prefix: "&8[&cGawharaeClog&8] &7"

